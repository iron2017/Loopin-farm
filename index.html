<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sensor Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --card: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --on: #22c55e;
      --off: #ef4444;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 55%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .dashboard {
      width: min(980px, 100%);
      background: rgba(17, 24, 39, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 24px;
      backdrop-filter: blur(6px);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.3rem, 2.5vw, 1.8rem);
      font-weight: 700;
      letter-spacing: 0.4px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .toggle {
      border: 0;
      border-radius: 999px;
      min-width: 94px;
      padding: 10px 18px;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.25s ease, opacity 0.25s ease;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .toggle:hover { transform: translateY(-1px); }
    .toggle:active { transform: translateY(0); }

    .toggle.on { background: var(--on); }
    .toggle.off { background: var(--off); }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.95rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--off);
      box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5);
      transition: background-color 0.25s ease;
    }

    .dot.running {
      background: var(--on);
      box-shadow: 0 0 0 5px rgba(34, 197, 94, 0.2);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      background: linear-gradient(160deg, rgba(31, 41, 55, 0.9), rgba(17, 24, 39, 0.95));
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 16px;
      padding: 18px;
      min-height: 165px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.2px;
    }

    .icon { font-size: 1.35rem; }

    .value {
      font-size: clamp(2rem, 6vw, 2.7rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.5px;
      transition: opacity 0.2s ease;
    }

    .subtle { color: var(--muted); font-size: 0.9rem; }

    @media (max-width: 760px) {
      .cards { grid-template-columns: 1fr; }
      .dashboard { padding: 18px; }
    }
  </style>
</head>
<body>
  <main class="dashboard" aria-live="polite">
    <section class="header">
      <h1>Farm Sensor Dashboard</h1>
      <div class="controls">
        <button id="toggleBtn" class="toggle on" type="button" aria-pressed="true">ON</button>
        <div class="status" id="statusText"><span id="statusDot" class="dot running"></span>System running</div>
      </div>
    </section>

    <section class="cards">
      <article class="card">
        <div class="card-head"><span>Soil Moisture</span><span class="icon" aria-hidden="true">🌱</span></div>
        <div id="moisture" class="value">--</div>
        <div class="subtle">Target range: 20%–80%</div>
      </article>

      <article class="card">
        <div class="card-head"><span>Temperature</span><span class="icon" aria-hidden="true">🌡️</span></div>
        <div id="temperature" class="value">--</div>
        <div class="subtle">Target range: 15°C–35°C</div>
      </article>

      <article class="card">
        <div class="card-head"><span>Air Humidity</span><span class="icon" aria-hidden="true">💧</span></div>
        <div id="humidity" class="value">--</div>
        <div class="subtle">Target range: 30%–90%</div>
      </article>
    </section>
  </main>

  <script>
    // Dashboard running state and update interval reference.
    let isRunning = true;
    let timerId = null;

    const fields = {
      moisture: document.getElementById('moisture'),
      temperature: document.getElementById('temperature'),
      humidity: document.getElementById('humidity')
    };

    const toggleBtn = document.getElementById('toggleBtn');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');

    // Create a realistic random value within an inclusive numeric range.
    const randomBetween = (min, max) => Math.random() * (max - min) + min;

    // Smoothly animate value text from its current number to a next number.
    function animateValue(element, from, to, format, duration = 450) {
      const start = performance.now();
      function tick(now) {
        const progress = Math.min((now - start) / duration, 1);
        const value = from + (to - from) * progress;
        element.textContent = format(value);
        if (progress < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    function updateSensors() {
      const next = {
        moisture: randomBetween(20, 80),
        temperature: randomBetween(15, 35),
        humidity: randomBetween(30, 90)
      };

      const previous = {
        moisture: parseFloat(fields.moisture.dataset.value || next.moisture),
        temperature: parseFloat(fields.temperature.dataset.value || next.temperature),
        humidity: parseFloat(fields.humidity.dataset.value || next.humidity)
      };

      fields.moisture.dataset.value = next.moisture.toFixed(1);
      fields.temperature.dataset.value = next.temperature.toFixed(1);
      fields.humidity.dataset.value = next.humidity.toFixed(1);

      animateValue(fields.moisture, previous.moisture, next.moisture, (v) => `${v.toFixed(1)}%`);
      animateValue(fields.temperature, previous.temperature, next.temperature, (v) => `${v.toFixed(1)}°C`);
      animateValue(fields.humidity, previous.humidity, next.humidity, (v) => `${v.toFixed(1)}%`);
    }

    function setRunningState(running) {
      isRunning = running;
      toggleBtn.textContent = running ? 'ON' : 'OFF';
      toggleBtn.classList.toggle('on', running);
      toggleBtn.classList.toggle('off', !running);
      toggleBtn.setAttribute('aria-pressed', String(running));

      statusDot.classList.toggle('running', running);
      statusText.lastChild.textContent = running ? 'System running' : 'System stopped';

      if (!running) {
        clearInterval(timerId);
        timerId = null;
        Object.values(fields).forEach((el) => { el.textContent = '--'; el.removeAttribute('data-value'); });
        return;
      }

      updateSensors();
      timerId = setInterval(updateSensors, 2000);
    }

    toggleBtn.addEventListener('click', () => setRunningState(!isRunning));

    // Start immediately in ON mode.
    setRunningState(true);
  </script>
</body>
</html>
