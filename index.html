<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sensor Dashboard</title>
    <link rel="stylesheet" href="styles.css" />

</head>
<body>
  <main class="dashboard" aria-live="polite">
    <section class="header">
      <h1>Farm Sensor Dashboard</h1>
      <div class="controls">
        <button id="toggleBtn" class="toggle on" type="button" aria-pressed="true">ON</button>
        <div class="status" id="statusText"><span id="statusDot" class="dot running"></span>System running</div>
      </div>
    </section>

    <section class="cards">
      <article class="card">
        <div class="card-head"><span>Soil Moisture</span><span class="icon" aria-hidden="true">🌱</span></div>
        <div id="moisture" class="value">--</div>
        <div class="subtle">Target range: 20%–80%</div>
      </article>

      <article class="card">
        <div class="card-head"><span>Temperature</span><span class="icon" aria-hidden="true">🌡️</span></div>
        <div id="temperature" class="value">--</div>
        <div class="subtle">Target range: 15°C–35°C</div>
      </article>

      <article class="card">
        <div class="card-head"><span>Air Humidity</span><span class="icon" aria-hidden="true">💧</span></div>
        <div id="humidity" class="value">--</div>
        <div class="subtle">Target range: 30%–90%</div>
      </article>
    </section>
  </main>

    <script src="app.js"></script>

</body>
</html>
